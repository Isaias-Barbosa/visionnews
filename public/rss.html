<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Notícias RSS — VisionNews</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap"

    <header class="adminHeader">

      <a href="/dashboard">Dashboard editorial ↗</a>

      <div class="adminTop">

          <span class="eyebrow">RADAR DE FONTES</span>

        <a class="outlineButton" href="/dashboard">Ir para o dashboard →</a>

      <div

      ></div>

    <script src="/content.js"></script>
    <script src="/rss-sources.js"></script>
